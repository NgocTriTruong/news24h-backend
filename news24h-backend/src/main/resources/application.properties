spring.application.name=news24h-backend

# ==============================
# SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# DATABASE CONFIG (MySQL 8)
# ==============================
spring.datasource.url=jdbc:mysql://139.59.249.140:3306/news24h?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT CONFIG
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==========================================
# GEMINI API
# ==========================================
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.model}:generateContent

