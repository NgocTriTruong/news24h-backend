spring.application.name=news24h-backend

# ==============================
# SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# DATABASE CONFIG (MySQL 8)
# ==============================
spring.datasource.url=jdbc:mysql://139.59.249.140:3306/news24h?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT CONFIG
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==========================================
# GEMINI API
# ==========================================
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.model}:generateContent
ai.ratelimit.rpm=10
ai.ratelimit.window-seconds=60

# ==========================================
# LOGIN GG, FB
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ==========================================
# LOGIN ZL
# ==========================================
zalo.app-id=${ZALO_APP_ID}
zalo.app-secret=${ZALO_APP_SECRET}
#zalo.redirect-uri=http://localhost:8080/api/auth/zalo/callback
zalo.redirect-uri=http://139.59.249.140.nip.io:8080/api/auth/zalo/callback



